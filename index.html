<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Integral Claudio (S-D) - Libreta Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-6 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-400">Taller Integral Claudio (S-D)</h1>
                <p class="text-slate-400 text-sm">Libreta Digital y Historial de Servicios - Morón / Haedo</p>
            </div>
            <div id="status-badge" class="px-3 py-1 bg-emerald-900/60 border border-emerald-500/40 text-emerald-400 text-xs rounded-full font-medium">
                Sistema Verificado
            </div>
        </header>

        <main id="app-container" class="space-y-6">
            <!-- Contenido dinámico inyectado por JS según ?data= o modo taller -->
        </main>
    </div>

    <script>
        // Lógica de decodificación robusta para URLs Stateless
        function decodePayload() {
            const params = new URLSearchParams(window.location.search);
            const dataParam = params.get('data');
            if (!dataParam) return null;
            try {
                const jsonString = decodeURIComponent(escape(atob(dataParam)));
                return JSON.parse(jsonString);
            } catch (e) {
                try {
                    // Fallback para decodificación directa
                    return JSON.parse(atob(dataParam));
                } catch (err) {
                    console.error("Error al decodificar datos:", err);
                    return null;
                }
            }
        }

        const vehicleData = decodePayload();
        const container = document.getElementById('app-container');

        if (vehicleData) {
            // Modo Cliente (Viendo el QR escaneado)
            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-6">
                    <div class="border-b border-slate-700 pb-4 flex justify-between items-start">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-amber-400 font-bold">Ficha Técnica del Vehículo</span>
                            <h2 class="text-3xl font-bold text-white mt-1">${vehicleData.patente || 'Sin Patente'}</h2>
                            <p class="text-slate-300 text-lg">${vehicleData.vehiculo || 'Vehículo General'}</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block bg-emerald-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-md">VERIFICADO TALLER S-D</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                        <div>
                            <span class="text-xs text-slate-400 block">Propietario</span>
                            <span class="font-medium text-white">${vehicleData.cliente || 'Particular'}</span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block">Último Kilometraje</span>
                            <span class="font-medium text-white">${vehicleData.km || 'No registrado'} km</span>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-lg font-semibold text-amber-400 mb-3">Historial de Servicios</h3>
                        <div class="bg-slate-900 rounded-lg p-4 border border-slate-700 text-slate-300 text-sm whitespace-pre-line">
                            ${vehicleData.historial || 'Sin servicios registrados en esta libreta.'}
                        </div>
                    </div>

                    <div class="text-center pt-4 border-t border-slate-700 text-xs text-slate-500">
                        Taller Integral Claudio (S-D) • Morón / Haedo • Garantía de Servicio
                    </div>
                </div>
            `;
        } else {
            // Modo Taller / Panel Principal
            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-4 text-center py-12">
                    <h2 class="text-2xl font-bold text-white">Panel del Taller Activo</h2>
                    <p class="text-slate-400 max-w-md mx-auto">El sistema de Libretas Digitales de Taller Integral Claudio (S-D) se encuentra en línea correctamente.</p>
                    <div class="pt-4">
                        <a href="javascript:alert('Para ver la libreta de un cliente, genere y escanee el código QR desde su gestor de vehículos interno.');" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-lg transition-colors">
                            Ver Instrucciones de Uso
                        </a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
