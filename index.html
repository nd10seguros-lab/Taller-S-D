<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Integral Claudio (S-D) - Libreta Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Encabezado con el Logotipo Integrado -->
        <header class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-6 shadow-2xl flex flex-col sm:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <!-- Logotipo vectorial fiel a la marca -->
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-center shadow-inner">
                    <svg class="h-14 w-auto object-contain" viewBox="0 0 300 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Silueta del auto en gris claro -->
                        <path d="M25 65H15V50L25 45V35L80 25H160L210 35L265 60L285 65H200M95 65H205" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M90 25L110 10H160L180 25" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Letras S-D en rojo corporativo -->
                        <path d="M100 78C98 73 103 70 109 70C116 70 119 74 115 79L103 86C99 89 101 94 108 94H116M130 71V93H138V85H144C149 85 152 81 152 78C152 74 149 71 144 71H130Z" fill="#EF4444"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-amber-400 tracking-wide">TALLER CLAUDIO</h1>
                    <p class="text-slate-400 text-xs font-semibold tracking-wider uppercase">Integral (S-D) • Morón / Haedo</p>
                </div>
            </div>
            <div class="px-4 py-1.5 bg-emerald-950 border border-emerald-600/40 text-emerald-400 text-xs rounded-full font-bold tracking-wider uppercase shadow-inner">
                ✓ Libreta Verificada
            </div>
        </header>

        <main id="app-container" class="space-y-6">
            <!-- Contenido dinámico -->
        </main>
    </div>

    <script>
        function decodePayload() {
            const params = new URLSearchParams(window.location.search);
            const dataParam = params.get('data');
            if (!dataParam) return null;
            try {
                return JSON.parse(decodeURIComponent(escape(atob(dataParam))));
            } catch (e) {
                try {
                    return JSON.parse(atob(dataParam));
                } catch (err) {
                    return null;
                }
            }
        }

        const vehicleData = decodePayload();
        const container = document.getElementById('app-container');

        if (vehicleData) {
            container.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
                    <div class="border-b border-slate-800 pb-5 flex flex-col sm:flex-row justify-between items-start gap-4">
                        <div>
                            <span class="text-xs uppercase tracking-widest text-amber-400 font-bold">Ficha Técnica del Vehículo</span>
                            <h2 class="text-4xl font-black text-white mt-1 tracking-tight">${vehicleData.patente || 'SIN PATENTE'}</h2>
                            <p class="text-slate-300 text-xl font-medium mt-0.5">${vehicleData.vehiculo || 'Vehículo General'}</p>
                        </div>
                        <span class="bg-amber-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-lg tracking-wider uppercase shadow">
                            S-D OFICIAL
                        </span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950/60 p-5 rounded-xl border border-slate-800">
                        <div>
                            <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block">Propietario</span>
                            <span class="text-lg font-bold text-white">${vehicleData.cliente || 'Particular'}</span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block">Kilometraje Registrado</span>
                            <span class="text-lg font-bold text-emerald-400">${vehicleData.km || '0'} km</span>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-lg font-bold text-amber-400 mb-3 flex items-center gap-2">
                            <span>📋</span> Historial de Servicios y Mantenimiento
                        </h3>
                        <div class="bg-slate-950 rounded-xl p-5 border border-slate-800 text-slate-200 text-sm sm:text-base whitespace-pre-line leading-relaxed shadow-inner">
                            ${vehicleData.historial || 'No hay servicios registrados en esta libreta digital.'}
                        </div>
                    </div>

                    <div class="text-center pt-6 border-t border-slate-800 text-xs text-slate-500 font-medium">
                        Taller Integral Claudio (S-D) • Morón / Haedo • Garantía y Calidad en Servicio Mecánico
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center py-16 space-y-4">
                    <div class="w-16 h-16 bg-amber-400/10 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold border border-amber-400/20">
                        S-D
                    </div>
                    <h2 class="text-3xl font-black text-white tracking-tight">Panel del Taller Activo</h2>
                    <p class="text-slate-400 max-w-md mx-auto text-sm sm:text-base">
                        El sistema de Libretas Digitales de Taller Integral Claudio (S-D) está en línea y sincronizado correctamente.
                    </p>
                    <div class="pt-4">
                        <span class="inline-block bg-slate-800 text-amber-400 font-bold px-6 py-3 rounded-xl border border-slate-700 text-sm">
                            Generá un QR desde tu gestor para ver la libreta de un vehículo.
                        </span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
